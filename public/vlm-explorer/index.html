<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLM Landscape — Interactive Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS — DARK (default) ─── */
:root {
  --bg: #0C0D0F;
  --surface-1: #131518;
  --surface-2: #1A1D22;
  --surface-3: #22262D;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.13);
  --border-stronger: rgba(255,255,255,0.22);
  --text-primary: #F0F2F5;
  --text-secondary: #9BA3AE;
  --text-muted: #5A6270;
  --shadow: 0 2px 16px rgba(0,0,0,0.4);
  --font-display: 'Syne', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 12px;
  --transition: 0.18s ease;
}

/* ─── TOKENS — LIGHT ─── */
html.light {
  --bg: #F4F5F7;
  --surface-1: #FFFFFF;
  --surface-2: #FFFFFF;
  --surface-3: #EEF0F3;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --border-stronger: rgba(0,0,0,0.24);
  --text-primary: #0F1117;
  --text-secondary: #4A5264;
  --text-muted: #8E97A8;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
}

/* arch block themes — light overrides */
html.light .t-img{--bg:#F2F3F4;--bd:#888780;--tx:#4A4944}
html.light .t-bb{--bg:#EEF6E5;--bd:#4C7A18;--tx:#2E5A08}
html.light .t-proj{--bg:#E8F1FA;--bd:#2A6FBB;--tx:#1A4E8A}
html.light .t-enc{--bg:#E5F5EF;--bd:#147A5A;--tx:#0B5240}
html.light .t-dec{--bg:#EDEAF8;--bd:#5E57BB;--tx:#3A348A}
html.light .t-head{--bg:#FDF3E0;--bd:#B87A10;--tx:#7A4E00}
html.light .t-loss{--bg:#FAEDE8;--bd:#A83A18;--tx:#6E200A}
html.light .t-q{--bg:#FAE8F0;--bd:#A83860;--tx:#6E1840}
html.light .t-clip{--bg:#E8F0FA;--bd:#2260AA;--tx:#103E7A}
html.light .t-lang{--bg:#F0E8FA;--bd:#6B3A8A;--tx:#3E1860}
html.light .t-out{--bg:#FDF8E2;--bd:#A87E10;--tx:#6E5000}
html.light .t-cross{--bg:#EEE8FA;--bd:#6A3AD4;--tx:#3A1899}
html.light .arch-grp{border-color:rgba(0,0,0,0.08)}
html.light .filter-btn.active{color:#fff}

*{box-sizing:border-box;margin:0;padding:0}
html{transition:background .25s,color .25s}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}

/* ─── LAYOUT ─── */
.page{max-width:1280px;margin:0 auto;padding:0 32px 100px}

/* ─── HEADER ─── */
.site-header{padding:52px 0 0;display:grid;grid-template-columns:1fr auto;align-items:start;gap:24px}
.header-left{}
.header-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.header-title{font-family:var(--font-display);font-size:clamp(32px,4.5vw,52px);font-weight:800;line-height:1.04;letter-spacing:-.02em;color:var(--text-primary)}
.header-title span{background:linear-gradient(135deg,#5DCAA5,#7F77DD 60%,#ED93B1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-sub{margin-top:14px;font-size:14.5px;color:var(--text-secondary);line-height:1.65;max-width:520px;padding-bottom:40px;border-bottom:0.5px solid var(--border)}

/* ─── THEME TOGGLE ─── */
.theme-toggle{display:flex;align-items:center;gap:8px;margin-top:4px;flex-shrink:0}
.theme-toggle-track{width:44px;height:24px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-3);cursor:pointer;position:relative;transition:background .2s,border-color .2s;flex-shrink:0}
.theme-toggle-thumb{width:18px;height:18px;border-radius:50%;background:var(--text-muted);position:absolute;top:2px;left:2px;transition:transform .2s,background .2s}
html.light .theme-toggle-thumb{transform:translateX(20px);background:#7F77DD}
.theme-toggle-label{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:.05em;user-select:none;white-space:nowrap}

/* ─── SECTION HEADER ─── */
.section-row{display:flex;align-items:center;gap:16px;padding:44px 0 22px}
.section-label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase}
.section-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-primary)}
.section-line{flex:1;height:0.5px;background:var(--border)}

/* ─── FILTER PILLS ─── */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px}
.filter-btn{font-size:11px;font-weight:500;font-family:var(--font-mono);padding:6px 15px;border-radius:99px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;transition:all var(--transition);letter-spacing:.04em}
.filter-btn:hover{background:var(--surface-3);color:var(--text-primary)}
.filter-btn.active{border-color:transparent;color:#0C0D0F;background:linear-gradient(135deg,#5DCAA5,#7F77DD)}

/* ─── CATEGORY GRID — 2 columns ─── */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:780px){.cat-grid{grid-template-columns:1fr}}

.cat-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:22px 24px;cursor:pointer;transition:border-color var(--transition),background var(--transition),box-shadow var(--transition);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity var(--transition)}
.cat-card:hover{border-color:var(--border-strong);background:var(--surface-3);box-shadow:0 4px 24px rgba(0,0,0,0.25)}
.cat-card:hover::before{opacity:1}
.cat-card.expanded{border-color:var(--border-stronger);box-shadow:0 4px 28px rgba(0,0,0,0.3)}
.cat-card.expanded::before{opacity:1}

.cat-header{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.cat-title{font-size:14px;font-weight:600;color:var(--text-primary);line-height:1.2}
.cat-count{margin-left:auto;font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.cat-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:14px}

.model-pills{display:flex;flex-wrap:wrap;gap:6px}
.model-pill{font-size:11px;font-weight:500;font-family:var(--font-mono);padding:4px 11px;border-radius:99px;border:0.5px solid;cursor:pointer;transition:all 0.1s;position:relative}
.model-pill:hover{filter:brightness(1.15);transform:scale(1.04)}

.cat-detail{margin-top:16px;padding-top:16px;border-top:0.5px solid var(--border);display:none}
.cat-card.expanded .cat-detail{display:block}
.detail-grid{display:grid;grid-template-columns:84px 1fr;gap:6px 14px}
.detail-key{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;padding-top:1px}
.detail-val{font-size:12.5px;color:var(--text-secondary);line-height:1.55}

/* ─── MODEL DETAIL VIEW ─── */
.model-view{display:none;animation:fadeSlide .22s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.back-btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);font-family:var(--font-mono);cursor:pointer;padding:8px 0 36px;transition:color var(--transition);background:none;border:none;letter-spacing:.04em}
.back-btn:hover{color:var(--text-primary)}
.back-btn svg{transition:transform var(--transition)}
.back-btn:hover svg{transform:translateX(-2px)}

.model-hero{display:flex;flex-direction:column;gap:4px;margin-bottom:36px}
.model-category-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:10px}
.model-category-dot{width:7px;height:7px;border-radius:50%}
.model-name{font-family:var(--font-display);font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.model-task-tag{display:inline-block;margin-top:10px;font-size:11px;font-family:var(--font-mono);padding:4px 12px;border-radius:99px;font-weight:500}
.model-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.model-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--font-mono);font-weight:500;padding:6px 14px;border-radius:8px;border:0.5px solid;text-decoration:none;transition:all var(--transition);cursor:pointer}
.model-link:hover{filter:brightness(1.15);transform:translateY(-1px)}
.model-link-paper{background:#0E1A2B;border-color:#378ADD;color:#85B7EB}
.model-link-hf{background:#231800;border-color:#D4A017;color:#F0C040}
html.light .model-link-paper{background:#E5F0FA;border-color:#2A6FBB;color:#1A4E8A}
html.light .model-link-hf{background:#FDF3D8;border-color:#A87A10;color:#6E5000}

.model-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px}
@media(max-width:680px){.model-body{grid-template-columns:1fr}}

.info-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.info-card.full{grid-column:1/-1}
.info-card-label{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.info-card-label::after{content:'';flex:1;height:0.5px;background:var(--border)}
.info-card p{font-size:13.5px;color:var(--text-secondary);line-height:1.68}
.info-card p strong{color:var(--text-primary);font-weight:500}

.novelty-list,.limit-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.novelty-list li,.limit-list li{display:flex;gap:10px;font-size:13px;color:var(--text-secondary);line-height:1.55}
.novelty-list li::before{content:'✦';color:#5DCAA5;flex-shrink:0;font-size:10px;margin-top:3px}
.limit-list li::before{content:'◆';color:#ED93B1;flex-shrink:0;font-size:9px;margin-top:4px}

/* ─── ARCHITECTURE ─── */
.arch-section{background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:28px;box-shadow:var(--shadow)}
.arch-detail-panel{border:0.5px solid var(--border);border-radius:9px;background:var(--surface-1);padding:14px 18px;margin-bottom:16px;min-height:76px;transition:all .2s}
.d-empty{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
.d-header{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.d-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-title{font-size:13px;font-weight:500;color:var(--text-primary)}
.d-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.d-chip{font-size:10px;font-family:var(--font-mono);font-weight:500;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.d-body{font-size:12px;color:var(--text-secondary);line-height:1.62}
.d-body em{color:var(--text-primary);font-style:normal;font-weight:500}
.d-kv{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:7px}
.d-kv span{font-size:10px;color:var(--text-muted)}
.d-kv span b{color:var(--text-secondary);font-weight:400;font-family:var(--font-mono)}

/* arch diagram blocks */
.arch-diagram{display:flex;gap:8px;align-items:flex-end;padding-bottom:8px;overflow-x:auto}
.arch-col{display:flex;flex-direction:column;align-items:stretch;gap:0}
.arch-col-label{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:6px;color:var(--text-muted)}
.arch-blk{border-radius:7px;border:1px solid;padding:7px 9px;margin-bottom:3px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:2px}
.arch-blk:hover{filter:brightness(1.1);transform:scale(1.01)}
.arch-blk.active{outline:2px solid;outline-offset:1px}
.arch-blk-name{font-size:10px;font-weight:500;line-height:1.2}
.arch-blk-sub{font-size:8.5px;font-family:var(--font-mono);opacity:.7;line-height:1.2}
.arch-grp{border-radius:9px;padding:6px 6px 4px;margin-bottom:4px;border:1px solid rgba(255,255,255,.08)}
.arch-grp-title{font-size:8px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;padding:0 2px;color:var(--text-muted)}
.arch-up{display:flex;justify-content:center;height:12px;margin:1px 0}
.arch-flow-label{font-size:8.5px;color:var(--text-muted);text-align:center;margin-top:4px}
.arch-cross-col{width:28px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px}

/* ─── LINEAR ARCH ─── */
.linear-arch{display:flex;flex-direction:column;gap:0;align-items:stretch;max-width:420px;margin:0 auto}
.linear-arch .arch-up{}

/* color themes — dark */
.t-img{--bg:#1C2020;--bd:#888780;--tx:#C2C0B8}
.t-bb{--bg:#182212;--bd:#639922;--tx:#97C459}
.t-proj{--bg:#0E1B2A;--bd:#378ADD;--tx:#85B7EB}
.t-enc{--bg:#0A1E18;--bd:#1D9E75;--tx:#5DCAA5}
.t-dec{--bg:#16143A;--bd:#7F77DD;--tx:#AFA9EC}
.t-head{--bg:#231600;--bd:#EF9F27;--tx:#FAC775}
.t-loss{--bg:#241008;--bd:#D85A30;--tx:#F0997B}
.t-q{--bg:#1F0A15;--bd:#D4537E;--tx:#ED93B1}
.t-clip{--bg:#0E1A2B;--bd:#4A90D9;--tx:#8CB8EC}
.t-lang{--bg:#1A0E2B;--bd:#9B59B6;--tx:#C39BD3}
.t-out{--bg:#1A1200;--bd:#D4A017;--tx:#F0C040}
.t-cross{--bg:#1A1020;--bd:#8B5CF6;--tx:#C4B5FD}

.arch-blk{background:var(--bg);border-color:var(--bd);color:var(--tx)}
.arch-blk-name{color:var(--tx)}
.arch-blk.active{outline-color:var(--bd)}
.arch-grp{border-color:rgba(255,255,255,.06)}

.params-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--font-mono);font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid;letter-spacing:.03em;background:#16143A;border-color:#7F77DD;color:#AFA9EC}
html.light .params-badge{background:#EDEAF8;border-color:#5E57BB;color:#3A348A}
.params-note{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);padding:5px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--surface-3)}

/* ─── LICENSE / AVAILABILITY BADGES ─── */
.model-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.avail-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--font-mono);font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid;letter-spacing:.03em}
.avail-open    {background:#0A1E18;border-color:#1D9E75;color:#5DCAA5}
.avail-api     {background:#0E1B2A;border-color:#378ADD;color:#85B7EB}
.avail-partial {background:#231600;border-color:#EF9F27;color:#FAC775}
.avail-closed  {background:#241008;border-color:#D85A30;color:#F0997B}
html.light .avail-open    {background:#E5F5EF;border-color:#147A5A;color:#0B5240}
html.light .avail-api     {background:#E8F1FA;border-color:#2A6FBB;color:#1A4E8A}
html.light .avail-partial {background:#FDF3E0;border-color:#B87A10;color:#7A4E00}
html.light .avail-closed  {background:#FAEDE8;border-color:#A83A18;color:#6E200A}

.commercial-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--font-mono);font-weight:500;padding:5px 12px;border-radius:99px;border:1px solid}
.commercial-yes        {background:#0A1E18;border-color:#1D9E75;color:#5DCAA5}
.commercial-restricted {background:#231600;border-color:#EF9F27;color:#FAC775}
.commercial-no         {background:#241008;border-color:#D85A30;color:#F0997B}
html.light .commercial-yes        {background:#E5F5EF;border-color:#147A5A;color:#0B5240}
html.light .commercial-restricted {background:#FDF3E0;border-color:#B87A10;color:#7A4E00}
html.light .commercial-no         {background:#FAEDE8;border-color:#A83A18;color:#6E200A}

.license-info{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);padding:5px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--surface-3)}
.weights-info{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);padding:5px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--surface-3)}

/* ─── VIEW TABS ─── */
.view-tabs{display:flex;gap:4px;padding:32px 0 0;margin-bottom:0}
.view-tab{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-family:var(--font-mono);font-weight:500;letter-spacing:.04em;padding:8px 18px;border-radius:8px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;transition:all var(--transition)}
.view-tab:hover{background:var(--surface-3);color:var(--text-primary)}
.view-tab.active{background:var(--surface-2);border-color:var(--border-stronger);color:var(--text-primary);box-shadow:var(--shadow)}
html.light .view-tab.active{background:#fff}

/* ─── TIMELINE ─── */
.tl-legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:28px}
.tl-leg-item{display:flex;align-items:center;gap:7px;font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:6px;transition:background var(--transition)}
.tl-leg-item:hover{background:var(--surface-3)}
.tl-leg-item.dimmed{opacity:.35}
.tl-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.tl-wrap{overflow-x:auto;padding-bottom:24px}
.tl-scroll{min-width:860px}

/* year header row */
.tl-year-row{display:flex;margin-left:148px;margin-bottom:0;position:sticky;top:0;z-index:10;background:var(--bg);padding:0 0 0}
.tl-year-cell{flex:1;text-align:center;font-size:11px;font-family:var(--font-mono);font-weight:700;color:var(--text-muted);letter-spacing:.08em;padding:10px 0 8px;border-bottom:1px solid var(--border);position:relative}
.tl-year-cell.current-year{color:var(--text-primary)}
.tl-year-cell::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0.5px;background:var(--border)}

/* category rows */
.tl-cat-row{display:flex;align-items:stretch;min-height:72px;border-bottom:0.5px solid var(--border);position:relative}
.tl-cat-row:last-child{border-bottom:none}
.tl-cat-row:hover .tl-row-bg{opacity:1}

.tl-row-bg{position:absolute;inset:0;opacity:0;transition:opacity .15s;pointer-events:none;border-radius:0}

.tl-cat-label{width:148px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:14px 16px 14px 0;position:sticky;left:0;background:var(--bg);z-index:5}
.tl-cat-emoji{font-size:16px;flex-shrink:0}
.tl-cat-name{font-size:11px;font-weight:600;color:var(--text-primary);line-height:1.3}
.tl-cat-sub{font-size:9px;color:var(--text-muted);font-family:var(--font-mono)}

/* year columns within a row */
.tl-row-cols{display:flex;flex:1}
.tl-col{flex:1;position:relative;border-left:0.5px solid var(--border);padding:8px 6px;display:flex;flex-direction:column;gap:5px;align-items:center}

/* model node */
.tl-node{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 6px;border-radius:20px;border:1px solid;cursor:pointer;transition:all .15s;width:100%;min-width:0}
.tl-node:hover{transform:translateY(-1px);filter:brightness(1.12);box-shadow:0 3px 12px rgba(0,0,0,0.25)}
.tl-node-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tl-node-name{font-size:10px;font-weight:500;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}

/* tooltip */

    paperUrl:'https://arxiv.org/abs/2310.03744', hfId:'llava-hf/llava-1.5-13b-hf',
    overview:`LLaVA-1.5's core contribution is almost embarrassingly simple: swap the single linear projection that bridges CLIP and the LLM for a two-layer MLP. That's it. The insight is that CLIP and the LLM live in fundamentally different feature spaces — CLIP is trained contrastively on image-text pairs, the LLM is trained autoregressively on text. A linear layer can only rotate and scale between those spaces; it cannot learn the nonlinear alignment they actually need. A two-layer MLP with a GELU nonlinearity can. This one change — with everything else held constant — pushed LLaVA from mid-tier to SOTA on 11 benchmarks with only 1.2M training samples.`,
    novelty:[
      'The MLP projection bridge: replacing LLaVA v1\'s single linear layer W with a two-layer MLP (Linear → GELU → Linear) is the entire architectural contribution — yet it doubles benchmark performance',
      'Showed that connector expressiveness matters more than connector complexity: the MLP matches or beats Q-Former (BLIP-2\'s 188M-parameter bridge) at a fraction of the parameter cost',
      'Academic-task data mixing: adding VQA, OCR, and region-level data to conversation data fills capability gaps the linear connector masked',
      'Scaling the CLIP input from 224px → 336px gives 576 spatial tokens (vs 256), giving the MLP more visual detail to project into LLM space',
    ],
    limits:[
      'Hallucination: the LLM generates plausible-sounding but false statements about visual content',

      'Frozen CLIP limits adaptation to unusual visual domains (medical, satellite imagery)',

      clip:{title:'CLIP ViT-L/14 @ 336px — Frozen',body:'24-layer frozen Vision Transformer. Each of the 576 spatial patch tokens exits the encoder as a 1024-dimensional vector encoding what is in that patch. Frozen throughout — only the MLP bridge and the LLM are trained.',chips:[{l:'tokens out',s:'576 × 1024-dim'},{l:'frozen',s:'Yes — weights never change'}],kv:{Layers:'24',Heads:'16',Why_frozen:'Preserve CLIP\'s rich pretrained representations'}},
      gap:{title:'The Problem LLaVA-1.5 Solves',body:'CLIP\'s 576 patch vectors live in a 1024-dimensional space shaped by contrastive image-text training. The LLM\'s token embeddings live in a 4096-dimensional space shaped by next-token prediction on text. These are different geometries. LLaVA v1 used a single linear layer W (1024→4096) to bridge them — but a linear map can only rotate, scale, and translate. It cannot learn the curved, nonlinear mapping that actually aligns visual and language feature spaces. This is the gap LLaVA-1.5 fixes.',chips:[{l:'CLIP dim',s:'1024'},{l:'LLM dim',s:'4096'},{l:'problem',s:'linear ≠ nonlinear alignment'}],kv:{LLaVA_v1:'single W matrix (linear projection)',LLaVA_1_5:'2-layer MLP with nonlinearity'}},
      mlp:{title:'MLP Projection Bridge ★ — The Core Contribution',body:'Two fully-connected layers with a GELU activation in between:\n\n  h = GELU( W₁ · vᵢ + b₁ )   [1024 → 4096]\n  tᵢ = W₂ · h + b₂           [4096 → 4096]\n\nApplied independently to each of the 576 patch tokens. The nonlinearity lets the network learn a curved mapping between CLIP space and LLM token space — something a single linear layer geometrically cannot do. This is the entire architectural difference from LLaVA v1, and it accounts for the majority of the performance gain.',chips:[{l:'W₁',s:'1024 → 4096'},{l:'activation',s:'GELU'},{l:'W₂',s:'4096 → 4096'},{l:'trainable params',s:'~33M'}],kv:{vs_linear:'linear: 1 matrix multiply; MLP: 2 + nonlinearity',vs_QFormer:'Q-Former has 188M params; this MLP has ~33M',Key_insight:'expressiveness > parameter count'}},

      pbd:{title:'PBD Stream ★ — Parallel Box Decoding',body:'The core contribution. Every bounding box is predicted as one atomic 6-token block:\n\n  <box>  x1  y1  x2  y2  </box>\n\nWithin this block, bidirectional attention lets all coordinate tokens attend to each other simultaneously — the model sees all four coordinates at once, maintaining geometric coherence. Between blocks, a block-causal mask keeps temporal order. Compared to NTP:\n  NTP: 4 sequential steps per box → coordinates treated as independent\n  PBD: 1 parallel step per box → coordinates predicted jointly\n\nBox-aligned block boundaries avoid the spurious cross-boundary artifacts of generic multi-token prediction (MTP).',chips:[{l:'block',s:'L=6 tokens (fixed)'},{l:'intra-block attn',s:'bidirectional'},{l:'inter-block attn',s:'block-causal'}],kv:{Speed:'16.9 BPS (PBD-fast mode)',vs_NTP:'6× faster per box',Geometric_coherence:'all 4 coords predicted jointly'}},
      router:{title:'Hybrid Router',body:'Monitors each PBD-predicted block before committing it. Triggers fallback to NTP for that block if either condition fires:\n  Format trigger: block has syntax violations (wrong token types or count)\n  Spatial trigger: top-1 coordinate token probability < 0.7 AND max-min spread across top-5 candidates > 80 (in [0,1000] normalized space)\n\nAfter a NTP-decoded fallback block, the model resumes PBD for subsequent boxes. This keeps throughput high for confident predictions while silently fixing edge cases.',chips:[{l:'default',s:'PBD (fast)'},{l:'fallback',s:'NTP (per-block only)'}],kv:{Format_trigger:'token type/count violation',Spatial_trigger:'prob < 0.7 AND spread > 80',Hybrid_speed:'12.7 BPS (vs 16.9 fast, 4.3 slow)'}},

    paperUrl:'https://arxiv.org/abs/2211.06220', hfId:'shi-labs/oneformer_ade20k_dinat_large',
    overview:`OneFormer is the first truly universal segmentation model trained only once to handle semantic, instance, and panoptic segmentation — all three tasks from a single model trained on a single dataset. Prior "universal" models like Mask2Former still needed three separate training runs (one per task) to reach peak performance. OneFormer solves this with two key ideas: a task token that tells the model which task to perform, and a query-text contrastive loss that sharpens inter-task and inter-class boundaries. A single OneFormer with a DiNAT-L backbone outperforms task-specific Mask2Former on all three tasks on ADE20K, COCO, and Cityscapes — using one-third the training resources.`,

    year:'2023', org:'Meta AI', paper:'Segment Anything',
    paperUrl:'https://arxiv.org/abs/2304.02643', hfId:'facebook/sam-vit-huge',
    overview:`SAM (Segment Anything Model) introduces the promptable segmentation task: given any image and any prompt — a point click, a bounding box, a rough mask, or free-form text — return a valid segmentation mask. Trained on the SA-1B dataset of 1.1 billion masks across 11 million images (the largest segmentation dataset ever assembled), SAM generalizes to object types and domains never seen during training. Its design separates a heavy image encoder (run once) from a lightweight mask decoder (runs in ~50ms), enabling real-time interactive use.`,

    archInfo:{
      frames:{title:'Streaming Video Frames',body:'SAM 2 processes video frame-by-frame in a streaming fashion — it never sees the full video at once. Each frame is resized to 1024×1024. Prompts can be applied to any frame; the model propagates the segmentation both forward and backward in time.',chips:[{l:'input',s:'1024×1024 per frame'},{l:'mode',s:'streaming / interactive'}],kv:{Propagation:'forward + backward from prompted frame'}},
      hiera:{title:'Hiera Hierarchical Image Encoder',body:'Replaces SAM 1\'s single-scale ViT-H with a multi-scale hierarchical transformer pre-trained with masked autoencoding. Four stages produce feature maps at strides 4, 8, 16, and 32. Windowed attention in early stages + global attention in later stages. Available in four sizes: Tiny, Small, Base+, Large.',chips:[{l:'stages',s:'4'},{l:'strides',s:'4,8,16,32'},{l:'sizes',s:'T/S/B+/L'}],kv:{Pretrain:'MAE',vs_SAM1:'3-5× faster, multi-scale'}},
      fpn:{title:'Feature Pyramid Network (FPN)',body:'Stride-16 and stride-32 features from Hiera stages 3–4 are aggregated via FPN to form the frame\'s memory embedding (coarse). Stride-4 and stride-8 features from stages 1–2 bypass the memory system and connect directly to the mask decoder via skip connections, providing fine spatial detail.',chips:[{l:'memory path',s:'stride-16/32 → memory attention'},{l:'skip path',s:'stride-4/8 → mask decoder'}],kv:{Novel:'fine-scale features bypass temporal module'}},
      mem_attn:{title:'Memory Attention — Key Innovation',body:'A stack of L transformer blocks that fuses the current frame\'s unconditioned Hiera embedding with memories from the bank. Block 1 performs self-attention on the current frame features; subsequent blocks perform cross-attention to memories (both spatial frame maps and compact object pointer tokens). This conditions each frame on its temporal context.',chips:[{l:'blocks',s:'L transformer'},{l:'cross-attn',s:'frame → memories'}],kv:{Input:'unconditioned frame features',Output:'memory-conditioned frame features'}},
      prompt:{title:'Prompt Encoder',body:'Identical to SAM 1 — supports point clicks, bounding boxes, and dense mask prompts on any chosen frame. Prompt tokens are indexed by frame number, allowing prompts given on frame 5 to propagate to all other frames.',chips:[{l:'types',s:'point, box, mask'},{l:'frames',s:'any frame in video'}],kv:{Propagation:'temporal via memory bank'}},

      mem_enc:{title:'Memory Encoder',body:'After each frame is decoded, the predicted mask is downsampled and fused element-wise with the Hiera image embedding, then compressed by lightweight convolutions to produce a compact spatial memory representation for this frame.',chips:[{l:'op',s:'mask ⊕ Hiera emb → conv → spatial map'}],kv:{Stored:'spatial feature map + object pointer token'}},

  'Mask2Former': {
    category:'segmentation', task:'Universal Image Segmentation (Semantic, Instance, Panoptic)',
    tagBg:'#220A2C', tagBd:'#A855F7', tagTx:'#D8B4FE',
    year:'2022', org:'Meta AI + UIUC', paper:'Masked-attention Mask Transformer for Universal Image Segmentation',
    paperUrl:'https://arxiv.org/abs/2112.01527', hfId:'facebook/mask2former-swin-large-coco-panoptic',
    overview:`Mask2Former is a single unified architecture that achieves state-of-the-art results on semantic, instance, and panoptic segmentation using the same model weights — just with different post-processing. Its core innovation is masked attention: instead of allowing each query to attend to the full image, each query attends only to the predicted foreground region for that query slot. This localizes attention to relevant features and dramatically accelerates training convergence. Combined with multi-scale deformable attention in a pixel decoder, Mask2Former became the dominant architecture for all three segmentation tasks.`,
    novelty:[
      'Masked attention: each query slot\'s attention is restricted to its predicted mask region — focusing the transformer on relevant pixels instead of full-image distraction',
      'A single architecture handles all three segmentation tasks (semantic, instance, panoptic) without task-specific modifications',
      'Multi-scale deformable attention in the pixel decoder recovers fine spatial detail from a backbone FPN at multiple resolutions',
      'Learnable object queries are initialized per task from a fixed set — no anchor boxes, no proposals, no NMS',
    ],
    limits:[
      'Closed vocabulary by default — requires open-vocabulary extensions (like MaskCLIP or FC-CLIP) to handle unseen class names',
      'Slower than real-time for many backbone choices; not suitable for interactive annotation unlike SAM',
      'Complex training setup with multiple loss terms (mask, dice, class) and bipartite matching',
      'Object query count must be set in advance — may miss objects in very dense scenes if query budget is exceeded',
    ],
    archType:'linear',
    archBlocks:[
      {id:'img',label:'Image',sub:'H × W',theme:'t-img'},
      {id:'backbone',label:'Backbone (Swin-L / ResNet)',sub:'multi-scale features C2-C5',theme:'t-bb'},
      {id:'pixel_dec',label:'Pixel Decoder (MSDeformAttn)',sub:'multi-scale deformable attention FPN',theme:'t-enc'},
      {id:'per_pixel',label:'Per-pixel Embeddings',sub:'H/4 × W/4 × C',theme:'t-enc'},
      {id:'queries',label:'Learnable Object Queries',sub:'100 × C (task-agnostic)',theme:'t-q'},
      {id:'masked_attn',label:'Transformer Decoder (L=9 layers)',sub:'masked-attn + self-attn + FFN per layer',theme:'t-dec'},
      {id:'cls_head',label:'Class Prediction Head',sub:'100 × (K+1)',theme:'t-head'},
      {id:'mask_head',label:'Mask Prediction Head',sub:'100 × H/4 × W/4 → upsampled',theme:'t-head'},
    ],
    archInfo:{
      img:{title:'Image Input',body:'Variable resolution image. Mask2Former is resolution-agnostic; the backbone produces multi-scale features regardless of input size.',chips:[{l:'input',s:'variable H × W'}],kv:{}},
      backbone:{title:'Backbone',body:'Mask2Former was demonstrated with both Swin Transformer (Swin-T/S/B/L) and ResNet backbones. Swin-L gives the best results. The backbone produces hierarchical feature maps C2 (stride 4) through C5 (stride 32).',chips:[{l:'best',s:'Swin-L'},{l:'scales',s:'C2–C5'}],kv:{Pretrain:'ImageNet-22K (Swin)'}},
      pixel_dec:{title:'Pixel Decoder — Multi-Scale Deformable Attention',body:'A Feature Pyramid Network enhanced with multi-scale deformable attention (from Deformable DETR). Merges C2–C5 features into a rich multi-scale representation. Outputs a fine-resolution per-pixel embedding map that the mask decoder uses for mask generation.',chips:[{l:'attn',s:'deformable (sparse sampling)'},{l:'output',s:'H/4 × W/4 × C'}],kv:{vs_FPN:'adds cross-scale deformable attention layers'}},
      per_pixel:{title:'Per-Pixel Embeddings',body:'The output of the pixel decoder: a dense H/4×W/4 feature map where each pixel has a C-dimensional embedding. Masks are produced by taking the dot product of object query embeddings with this map.',chips:[{l:'shape',s:'H/4 × W/4 × C'}],kv:{Role:'mask generation via dot product'}},
      queries:{title:'Learnable Object Queries',body:'100 (or 200 for COCO panoptic) learned query vectors, randomly initialized and trained end-to-end. Each query specializes in detecting one object or semantic region through the Hungarian matching loss. No spatial prior — specialization emerges purely from training.',chips:[{l:'count',s:'100–200'},{l:'dim',s:'C (256)'},{l:'init',s:'learned'}],kv:{vs_DETR:'masked attention focuses them faster'}},
      masked_attn:{title:'Transformer Decoder with Masked Attention — Core Innovation',body:'9 decoder layers, each with three sub-layers: (1) Masked cross-attention: each query attends to the image only within its predicted mask region from the previous layer. This replaces full cross-attention, dramatically reducing noise and accelerating convergence. (2) Self-attention among queries. (3) FFN. Auxiliary losses are applied after every decoder layer.',chips:[{l:'layers',s:'9'},{l:'masked-attn',s:'query attends only in predicted mask'}],kv:{Key_benefit:'3-4× fewer training iterations than MaskFormer',Aux_losses:'applied after each layer'}},
      cls_head:{title:'Class Prediction Head',body:'A single linear layer per query predicts class probabilities over K categories + 1 "no object" class. For semantic segmentation, all predictions are merged; for instance/panoptic, each query predicts one instance.',chips:[{l:'output',s:'N_q × (K+1)'},{l:'type',s:'linear + softmax'}],kv:{NMS:'not required (matching-based)'}},
      mask_head:{title:'Mask Prediction Head',body:'A 3-layer MLP maps each query embedding to a C-dimensional "mask embedding." The per-pixel mask is produced by the dot product of this embedding with the pixel decoder\'s per-pixel features, then bilinearly upsampled to full resolution. Loss: binary cross-entropy + dice loss.',chips:[{l:'mask',s:'dot product of query emb × pixel emb'},{l:'loss',s:'BCE + dice'}],kv:{Resolution:'H/4 → full res (4× bilinear)'}},

      clip_enc:{title:'Frozen CLIP ViT Backbone',body:'The standard CNN or Swin backbone used in Mask2Former is replaced by a frozen CLIP ViT. Because CLIP was trained on image-text pairs, its features carry semantic meaning that enables open-vocabulary generalization. Completely frozen — no gradient flows into CLIP during OMG-Seg training.',chips:[{l:'type',s:'CLIP ViT-L/14 (frozen)'},{l:'dim',s:'1024'}],kv:{Benefit:'built-in vision-language alignment',Frozen:'Yes — only pixel decoder + decoder train'}},

  'MaskCLIP': {
    category:'segmentation', task:'Open-Vocabulary Universal Segmentation via Frozen CLIP',
    tagBg:'#220A2C', tagBd:'#A855F7', tagTx:'#D8B4FE',
    year:'2023', org:'UCSD + CMU', paper:'Open-Vocabulary Universal Image Segmentation with MaskCLIP',
    paperUrl:'https://arxiv.org/abs/2208.08984', hfId:null,
    overview:`MaskCLIP shows that CLIP's ViT — frozen and unmodified — can be repurposed as a powerful open-vocabulary segmentation classifier. The key insight: instead of using CLIP's [CLS] global token for recognition, adapt the self-attention layers to produce dense, spatially localized embeddings that can be matched against text embeddings per region. A class-agnostic mask proposal network first generates candidate masks; CLIP then classifies each proposed region by comparing its local embedding to the text embeddings of any class names at test time — including classes never seen during training.`,

      'RMA adds overhead per mask proposal — inference scales linearly with the number of proposed regions',

      'Weaker on precise boundary segmentation compared to models trained end-to-end with pixel-level supervision',

      img:{title:'Image Input',body:'Standard RGB image at variable resolution. MaskCLIP is resolution-flexible since both components (proposal network and CLIP) handle variable inputs.',chips:[{l:'input',s:'variable H × W'}],kv:{}},
      proposal:{title:'Class-Agnostic Mask Proposal Network',body:'A trainable network (based on Mask2Former or similar) that generates binary mask proposals without any class labels. Its only job is to find plausible object or region boundaries — classification is entirely left to CLIP. Trained with only mask-level supervision (no class labels needed).',chips:[{l:'output',s:'M binary masks'},{l:'training',s:'mask supervision only, no class labels'}],kv:{Trainable:'Yes'}},

  const el = document.getElementById('filters');
  const allTags = [...new Set(CATS.flatMap(c => c.tags))];
  el.innerHTML = ['<button class="filter-btn active" data-tag="">All</button>',
    ...allTags.map(t => `<button class="filter-btn" data-tag="${t}">${TAG_LABELS[t]}</button>`)
  ].join('');
  el.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTag = btn.dataset.tag || null;
      el.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
    });
  });
}

function renderGrid() {
  const el = document.getElementById('cat-grid');
  const visible = activeTag ? CATS.filter(c => c.tags.includes(activeTag)) : CATS;
  el.innerHTML = visible.map(c => `
    <div class="cat-card" data-id="${c.id}" style="--header-grad:linear-gradient(90deg,${c.headerGrad})">
      <style>.cat-card[data-id="${c.id}"]::before{background:linear-gradient(90deg,${c.headerGrad})}</style>
      <div class="cat-header">
        <div class="cat-icon" style="background:${c.bg};border:0.5px solid ${c.pillBd}22;font-size:16px">${c.emoji}</div>
        <p class="cat-title">${c.title}</p>
        <span class="cat-count">${c.models.length} models</span>
      </div>
      <p class="cat-desc">${c.desc}</p>
      <div class="model-pills">
        ${c.models.map(m => {
          const hasDetail = MODELS[m] ? 'data-model="'+m+'"' : '';
          const style = `background:${c.pillBg};border-color:${c.pillBd};color:${c.pillTx}`;
          return `<span class="model-pill" ${hasDetail} style="${style}" title="${MODELS[m] ? 'Click to explore '+m : m}">${m}${MODELS[m] ? ' ↗' : ''}</span>`;
        }).join('')}
      </div>
      <div class="cat-detail">
        <div class="detail-grid">
          <span class="detail-key">Architecture</span><span class="detail-val">${c.arch}</span>
          <span class="detail-key">Output</span><span class="detail-val">${c.output}</span>
          <span class="detail-key">Strengths</span><span class="detail-val">${c.strength}</span>
          <span class="detail-key">Limitations</span><span class="detail-val">${c.limit}</span>
        </div>
      </div>
    </div>
  `).join('');

  // Card expand/collapse
  el.querySelectorAll('.cat-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('[data-model]')) return;
      const wasOpen = card.classList.contains('expanded');
      el.querySelectorAll('.cat-card').forEach(c => c.classList.remove('expanded'));
      if (!wasOpen) card.classList.add('expanded');
    });
  });

  // Model pill clicks
  el.querySelectorAll('[data-model]').forEach(pill => {
    pill.addEventListener('click', e => {
      e.stopPropagation();
      showModel(pill.dataset.model);
    });
  });
}

  return `

          <div class="arch-blk-sub">${b.sub}</div>

}

function selectBlock(id, el) {
  if (!currentModelData) return;
  document.querySelectorAll('.arch-blk').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const info = currentModelData.archInfo[id];
  if (!info) return;
  const panel = document.getElementById('arch-panel');
  document.getElementById('ap-empty').style.display = 'none';
  document.getElementById('ap-content').style.display = 'block';

  // dot color from theme
  const themeColors = {
    't-img':'#888780','t-bb':'#639922','t-proj':'#378ADD','t-enc':'#1D9E75',
    't-dec':'#7F77DD','t-head':'#EF9F27','t-loss':'#D85A30','t-q':'#D4537E',
    't-clip':'#4A90D9','t-lang':'#9B59B6','t-out':'#D4A017','t-cross':'#8B5CF6'
  };
  const blk = el.className.split(' ').find(c => c.startsWith('t-'));
  const col = themeColors[blk] || '#888';
  document.getElementById('ap-dot').style.background = col;
  document.getElementById('ap-title').textContent = info.title;

  const chipThemes = {
    't-img':{c:'#C2C0B8',bg:'#1C2020',b:'#888780'},'t-bb':{c:'#97C459',bg:'#182212',b:'#639922'},
    't-proj':{c:'#85B7EB',bg:'#0E1B2A',b:'#378ADD'},'t-enc':{c:'#5DCAA5',bg:'#0A1E18',b:'#1D9E75'},
    't-dec':{c:'#AFA9EC',bg:'#16143A',b:'#7F77DD'},'t-head':{c:'#FAC775',bg:'#231600',b:'#EF9F27'},
    't-loss':{c:'#F0997B',bg:'#241008',b:'#D85A30'},'t-q':{c:'#ED93B1',bg:'#1F0A15',b:'#D4537E'},
    't-clip':{c:'#8CB8EC',bg:'#0E1A2B',b:'#4A90D9'},'t-lang':{c:'#C39BD3',bg:'#1A0E2B',b:'#9B59B6'},
    't-out':{c:'#F0C040',bg:'#1A1200',b:'#D4A017'},'t-cross':{c:'#C4B5FD',bg:'#1A1020',b:'#8B5CF6'}
  };
  const cc = chipThemes[blk] || chipThemes['t-img'];
  const chipsEl = document.getElementById('ap-chips');
  chipsEl.innerHTML = (info.chips||[]).map(ch =>
    `<span class="d-chip" style="color:${cc.c};background:${cc.bg};border-color:${cc.b}"><span style="font-size:9px;opacity:.6;margin-right:3px">${ch.l}</span>${ch.s}</span>`
  ).join('');
  document.getElementById('ap-body').innerHTML = info.body;
  const kvEl = document.getElementById('ap-kv');
  kvEl.innerHTML = Object.entries(info.kv||{}).map(([k,v]) =>
    `<span>${k.replace(/_/g,' ')} <b>${v}</b></span>`
  ).join('');
}

function showModel(name) {
  const m = MODELS[name];
  if (!m) return;
  currentModelData = m;

  const cat = CATS.find(c => c.id === m.category);
  const lic = LICENSE[name] || {};
  const par = PARAMS[name] || {};

  const availLabel = {open:'Open Weights', api:'API Only', partial:'Partial Release', closed:'Closed / Proprietary'};
  const availIcon  = {open:'◉', api:'⬡', partial:'◑', closed:'○'};
  const commLabel  = lic.commercial === true ? '✓ Commercial OK' : lic.commercial === 'restricted' ? '⚠ Restricted' : '✕ Non-commercial only';
  const commClass  = lic.commercial === true ? 'commercial-yes' : lic.commercial === 'restricted' ? 'commercial-restricted' : 'commercial-no';

  const archHTML = m.archType === 'dual' ? renderDualArch(m) : m.archType === 'llava' ? renderLLaVAArch(m) : m.archType === 'gdino' ? renderGDinoArch(m) : m.archType === 'bagel' ? renderBagelArch(m) : m.archType === 'locateanything' ? renderLocateAnythingArch(m) : renderLinearArch(m);

  document.getElementById('model-detail-content').innerHTML = `
    <div class="model-hero">
      <div class="model-category-badge">
        <div class="model-category-dot" style="background:${cat?.pillBd||'#888'}"></div>
        ${cat?.title || m.category}
      </div>
      <div class="model-name">${name}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        <span class="model-task-tag" style="background:${m.tagBg};border:0.5px solid ${m.tagBd};color:${m.tagTx}">${m.task}</span>
        <span class="model-task-tag" style="background:var(--surface-2);border:0.5px solid var(--border);color:var(--text-muted)">${m.year} · ${m.org}</span>
      </div>
      <div class="model-links">
        ${m.paperUrl ? `<a class="model-link model-link-paper" href="${m.paperUrl}" target="_blank" rel="noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          ${m.paper}
        </a>` : ''}
        ${m.hfId ? `<a class="model-link model-link-hf" href="https://hfviewer.com/${m.hfId}" target="_blank" rel="noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          View on HF · ${m.hfId}
        </a>` : ''}
      </div>
    </div>

    ${lic.avail ? `<div class="model-meta-row">
      <span class="avail-badge avail-${lic.avail}">${availIcon[lic.avail]} ${availLabel[lic.avail]}</span>
      <span class="${commClass} commercial-badge">${commLabel}</span>
      ${par.total ? `<span class="params-badge">⬡ ${par.total}</span>` : ''}
      ${lic.license ? `<span class="license-info">⚖ ${lic.license}</span>` : ''}
      ${lic.weights ? `<span class="weights-info">⬇ ${lic.weights}</span>` : ''}
    </div>
    ${par.breakdown ? `<div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;line-height:1.6">
      <span style="opacity:.6">Params: </span>${par.breakdown}${par.note ? `<span style="opacity:.5"> — ${par.note}</span>` : ''}
    </div>` : ''}` : ''}

    <div class="model-body">
      <div class="info-card full">
        <div class="info-card-label">Overview</div>
        <p>${m.overview}</p>
      </div>
      <div class="info-card">
        <div class="info-card-label">What's novel &amp; important</div>
        <ul class="novelty-list">${m.novelty.map(n=>`<li>${n}</li>`).join('')}</ul>
      </div>
      <div class="info-card">
        <div class="info-card-label">Limitations</div>
        <ul class="limit-list">${m.limits.map(l=>`<li>${l}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="arch-section">
      <div class="info-card-label" style="margin-bottom:14px">Architecture — click any block to inspect</div>
      <div class="arch-detail-panel" id="arch-panel">
        <div class="d-empty" id="ap-empty">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>
          Click any block to see details
        </div>
        <div id="ap-content" style="display:none">
          <div class="d-header"><div class="d-dot" id="ap-dot"></div><div class="d-title" id="ap-title"></div></div>
          <div class="d-chips" id="ap-chips"></div>
          <div class="d-body" id="ap-body"></div>
          <div class="d-kv" id="ap-kv"></div>
        </div>
      </div>
      ${archHTML}
    </div>
  `;

  document.getElementById('cat-view').style.display = 'none';
  document.getElementById('timeline-view').style.display = 'none';
  const mv = document.getElementById('model-view');
  mv.style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('model-view').style.display = 'none';
  const returnTo = currentView === 'timeline' ? 'timeline-view' : 'cat-view';
  document.getElementById(returnTo).style.display = 'block';
  currentModelData = null;
  window.scrollTo({top:0,behavior:'smooth'});
});

// ── VIEW SWITCHING ──
let currentView = 'grid';
document.querySelectorAll('.view-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.view;
    if (v === currentView) return;
    currentView = v;
    document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('cat-view').style.display = (v === 'grid') ? 'block' : 'none';
    document.getElementById('timeline-view').style.display = (v === 'timeline') ? 'block' : 'none';
    if (v === 'timeline' && !timelineBuilt) buildTimeline();
  });
});

// ── TIMELINE ──
let timelineBuilt = false;

function buildTimeline() {
  timelineBuilt = true;
  const years = [2021, 2022, 2023, 2024, 2025, 2026];
  const catOrder = ['retrieval','vqa','captioning','grounding','generation','documents','video','agentic','segmentation'];

  // gather all models keyed by category then year
  const bycat = {};
  catOrder.forEach(c => { bycat[c] = {}; years.forEach(y => bycat[c][y] = []); });
  Object.entries(MODELS).forEach(([name, d]) => {
    const yr = parseInt(d.year);
    if (bycat[d.category] && years.includes(yr)) bycat[d.category][yr].push(name);
  });

  // cat meta from CATS array
  const catMeta = {};
  CATS.forEach(c => catMeta[c.id] = c);

  // tooltip
  const tooltip = document.createElement('div');
  tooltip.className = 'tl-tooltip';
  tooltip.innerHTML = '<div class="tl-tt-name"></div><div class="tl-tt-org"></div><div class="tl-tt-task"></div><div class="tl-tt-hint">Click to open →</div>';
  document.body.appendChild(tooltip);
  let ttTimer;

  function showTT(e, name, m) {
    clearTimeout(ttTimer);
    tooltip.querySelector('.tl-tt-name').textContent = name;
    tooltip.querySelector('.tl-tt-org').textContent = m.org + ' · ' + m.year;
    tooltip.querySelector('.tl-tt-task').textContent = m.task;
    const tx = Math.min(e.clientX + 14, window.innerWidth - 260);
    const ty = e.clientY - 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    tooltip.classList.add('visible');
  }
  function hideTT() {
    ttTimer = setTimeout(() => tooltip.classList.remove('visible'), 80);
  }

  // legend
  const legendEl = document.getElementById('tl-legend');
  legendEl.innerHTML = '';
  let activeCats = new Set(catOrder);

  catOrder.forEach(cid => {
    const cat = catMeta[cid];
    if (!cat) return;
    const item = document.createElement('div');
    item.className = 'tl-leg-item';
    item.dataset.cat = cid;
    item.innerHTML = `<span class="tl-leg-dot" style="background:${cat.pillBd}"></span>${cat.title}`;
    item.addEventListener('click', () => {
      if (activeCats.has(cid) && activeCats.size > 1) {
        activeCats.delete(cid);
        item.classList.add('dimmed');
      } else if (!activeCats.has(cid)) {
        activeCats.add(cid);
        item.classList.remove('dimmed');
      }
      updateRowVisibility();
    });
    legendEl.appendChild(item);
  });

  function updateRowVisibility() {
    document.querySelectorAll('.tl-cat-row').forEach(row => {
      row.style.display = activeCats.has(row.dataset.cat) ? '' : 'none';
    });
  }

  // build grid
  const wrap = document.getElementById('tl-wrap');
  wrap.innerHTML = '';
  const scroll = document.createElement('div');
  scroll.className = 'tl-scroll';

  // year header
  const yearRow = document.createElement('div');
  yearRow.className = 'tl-year-row';
  years.forEach(y => {
    const cell = document.createElement('div');
    cell.className = 'tl-year-cell' + (y === 2026 ? ' current-year' : '');
    cell.textContent = y;
    yearRow.appendChild(cell);
  });
  scroll.appendChild(yearRow);

  // category rows
  catOrder.forEach(cid => {
    const cat = catMeta[cid];
    if (!cat) return;
    const row = document.createElement('div');
    row.className = 'tl-cat-row';
    row.dataset.cat = cid;

    // subtle tinted background
    const rowBg = document.createElement('div');
    rowBg.className = 'tl-row-bg';
    rowBg.style.background = cat.pillBg;
    row.appendChild(rowBg);

    // label
    const label = document.createElement('div');
    label.className = 'tl-cat-label';
    const modelCount = catOrder.reduce((n, _) => n, 0);
    const cnt = Object.values(bycat[cid]).flat().length;
    label.innerHTML = `
      <span class="tl-cat-emoji">${cat.emoji}</span>
      <div>
        <div class="tl-cat-name">${cat.title}</div>
        <div class="tl-cat-sub">${cnt} model${cnt!==1?'s':''}</div>
      </div>`;
    row.appendChild(label);

    // columns
    const colsWrap = document.createElement('div');
    colsWrap.className = 'tl-row-cols';

    years.forEach(y => {
      const col = document.createElement('div');
      col.className = 'tl-col';

      const nodes = bycat[cid][y] || [];
      nodes.sort().forEach(name => {
        const m = MODELS[name];
        if (!m) return;
        const node = document.createElement('div');
        node.className = 'tl-node';
        node.style.cssText = `background:${cat.pillBg};border-color:${cat.pillBd};color:${cat.pillTx}`;
        node.innerHTML = `<span class="tl-node-dot" style="background:${cat.pillBd}"></span><span class="tl-node-name">${name}</span>`;
        node.addEventListener('mouseenter', e => showTT(e, name, m));
        node.addEventListener('mousemove', e => showTT(e, name, m));
        node.addEventListener('mouseleave', hideTT);
        node.addEventListener('click', () => {
          tooltip.classList.remove('visible');
          showModel(name);
        });
        col.appendChild(node);
      });
      colsWrap.appendChild(col);
    });

    row.appendChild(colsWrap);
    scroll.appendChild(row);
  });

  wrap.appendChild(scroll);
}

// ── THEME TOGGLE ──
(function(){
  const html = document.documentElement;
  const track = document.getElementById('toggle-track');
  const label = document.getElementById('toggle-label');
  const saved = localStorage.getItem('vlm-theme');
  if(saved === 'light') { html.classList.add('light'); label.textContent = 'Light'; }

  function toggle(){
    const isLight = html.classList.toggle('light');
    label.textContent = isLight ? 'Light' : 'Dark';
    localStorage.setItem('vlm-theme', isLight ? 'light' : 'dark');
  }
  document.getElementById('theme-toggle').addEventListener('click', toggle);
})();

// ── INIT ──
renderFilters();
renderGrid();
</script>
</body>
</html>
